<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- Subtle border glow -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.25"/>
  <!-- X Mark - Diagonal Beam 1 -->
  <rect x="26" y="6" width="12" height="52" rx="5" transform="rotate(45 32 32)" fill="url(#xGrad)"/>
  <!-- X Mark - Diagonal Beam 2 -->
  <rect x="26" y="6" width="12" height="52" rx="5" transform="rotate(-45 32 32)" fill="url(#xGrad)"/>
  <!-- Inner precision cut -->
  <rect x="30" y="20" width="4" height="24" rx="2" transform="rotate(45 32 32)" fill="#020202"/>
</svg>
